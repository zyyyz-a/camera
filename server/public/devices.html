<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ycamera · 机位监控</title>
<style>
  :root{--bg:#0d0f12;--card:#171a1f;--line:#262b33;--fg:#e9edf2;--dim:#8b95a5;--acc:#3ea6ff;--ok:#28c76f;--warn:#ff9f43;--err:#ff5b5b}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 -apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
  header{position:sticky;top:0;z-index:10;background:rgba(13,15,18,.95);backdrop-filter:blur(12px);border-bottom:1px solid var(--line);padding:12px 18px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  header b{font-size:16px}
  .stat{color:var(--dim);font-size:13px}
  .stat b{color:var(--fg)}
  .grow{margin-left:auto}
  button{background:var(--card);border:1px solid var(--line);color:var(--fg);border-radius:9px;padding:8px 13px;font-size:13px;font-weight:600;cursor:pointer}
  button.primary{background:var(--acc);border-color:var(--acc);color:#07131f}
  button.danger{color:var(--err);border-color:var(--err)}
  button:disabled{opacity:.4;cursor:default}
  .wrap{padding:16px 18px 60px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:14px}
  .dev{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px}
  .dev.off{opacity:.62}
  .dev .h{display:flex;align-items:center;gap:8px;margin-bottom:10px}
  .dev .h .n{font-weight:700;font-size:15px}
  .dot{width:9px;height:9px;border-radius:50%;background:#555}
  .dot.on{background:var(--ok);box-shadow:0 0 8px #28c76f88}
  .badge{font-size:11px;padding:2px 7px;border-radius:6px;background:#22262d;color:var(--dim)}
  .kv{display:grid;grid-template-columns:78px 1fr;gap:4px 10px;font-size:13px;margin-bottom:10px}
  .kv .k{color:var(--dim)}
  .kv .v{word-break:break-all}
  .acts{display:flex;gap:8px;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:10px}
  input,select{background:#0f1216;border:1px solid var(--line);color:var(--fg);border-radius:8px;padding:7px 9px;font-size:13px;width:76px}
  .tasks{margin-top:10px;font-size:12px;color:var(--dim);max-height:110px;overflow:auto}
  .tasks div{padding:2px 0;border-bottom:1px dashed #1e232a}
  .empty{color:var(--dim);text-align:center;padding:40px;font-size:14px}
  #login{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;z-index:70;padding:24px}
  #login .box{width:100%;max-width:340px}
  input[type=password]{width:100%;padding:13px 14px;margin-bottom:10px;font-size:15px}
  .hidden{display:none!important}
</style>
</head>
<body>

<div id="login">
  <div class="box">
    <h2 style="margin:0 0 4px;font-size:20px">机位监控</h2>
    <p style="color:var(--dim);font-size:13px;margin:0 0 18px">管理员口令</p>
    <input id="pw" type="password" placeholder="管理员口令">
    <div style="color:var(--warn);font-size:13px;min-height:18px" id="msg"></div>
    <button class="primary" id="btnLogin" style="width:100%;padding:13px">登录</button>
  </div>
</div>

<header>
  <b>机位监控</b>
  <span class="stat" id="sum"></span>
  <span class="grow"></span>
  <button id="btnRefresh">刷新</button>
  <button class="danger" id="btnClearTemp">清空临时预览</button>
  <a href="/apk/ycamera-agent.apk" style="color:var(--acc);font-size:13px;text-decoration:none;border:1px solid var(--acc);padding:6px 10px;border-radius:8px">下载采集端 APK</a>
  <a href="/admin" style="color:var(--acc);font-size:13px;text-decoration:none">素材库 →</a>
</header>

<div class="wrap">
  <div class="grid" id="grid"></div>
  <div class="empty" id="empty">还没有设备上线。手机装好采集端 App 并登录后会自动出现在这里。</div>
</div>

<script>
let token = localStorage.getItem('yc_admin_token') || '';
const $ = (id) => document.getElementById(id);
const fmtGB = (n) => n == null ? '—' : (n / 1073741824).toFixed(1) + ' GB';
const ago = (ts) => {
  if (!ts) return '从未';
  const s = Math.floor((Date.now() - ts) / 1000);
  if (s < 60) return s + ' 秒前';
  if (s < 3600) return Math.floor(s / 60) + ' 分钟前';
  if (s < 86400) return Math.floor(s / 3600) + ' 小时前';
  return Math.floor(s / 86400) + ' 天前';
};
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

const api = (p, o = {}) => {
  o.headers = Object.assign({}, o.headers, { 'x-token': token });
  return fetch(p, o).then(async (r) => {
    const t = await r.text();
    let j; try { j = JSON.parse(t); } catch (e) { j = {}; }
    if (!r.ok) throw new Error(j.error || t || r.status);
    return j;
  });
};

async function login() {
  $('msg').textContent = '';
  try {
    const r = await fetch('/api/login', {
      method: 'POST', headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ mode: 'admin', code: $('pw').value }),
    }).then(async (x) => { const j = await x.json(); if (!x.ok) throw new Error(j.error); return j; });
    token = r.token;
    localStorage.setItem('yc_admin_token', token);
    $('login').classList.add('hidden');
    refresh();
    setInterval(refresh, 10000);
  } catch (e) { $('msg').textContent = e.message; }
}
$('btnLogin').onclick = login;
$('pw').addEventListener('keydown', (e) => { if (e.key === 'Enter') login(); });
if (token) { $('login').classList.add('hidden'); refresh(); setInterval(refresh, 10000); }

async function refresh() {
  try {
    const r = await api('/api/devices');
    const online = r.devices.filter((d) => d.online).length;
    $('sum').innerHTML = `${r.devices.length} 台设备 · <b style="color:var(--ok)">${online}</b> 在线`;
    render(r.devices);
  } catch (e) {
    if (/401|未登录/.test(e.message)) { localStorage.removeItem('yc_admin_token'); location.reload(); }
  }
}

function render(devs) {
  $('empty').style.display = devs.length ? 'none' : '';
  const grid = $('grid');
  grid.innerHTML = '';
  for (const d of devs) grid.appendChild(card(d));
}

function card(d) {
  const el = document.createElement('div');
  el.className = 'dev' + (d.online ? '' : ' off');
  const bat = d.battery == null ? '—' : d.battery + '%' + (d.charging ? ' ⚡' : '');
  const loc = (d.lat != null && d.lng != null)
    ? `<a href="https://www.google.com/maps?q=${d.lat},${d.lng}" target="_blank" style="color:var(--acc)">${d.lat.toFixed(5)}, ${d.lng.toFixed(5)}</a>`
    : '<span style="color:var(--dim)">无定位(需授权位置)</span>';
  el.innerHTML = `
    <div class="h">
      <span class="dot ${d.online ? 'on' : ''}"></span>
      <span class="n">${esc(d.name)}</span>
      <span class="badge">${d.online ? '在线' : '离线'}</span>
      <span class="grow"></span>
      <span class="badge">${esc(d.model || '')}</span>
    </div>
    <div class="kv">
      <span class="k">电量</span><span class="v">${bat}</span>
      <span class="k">相册</span><span class="v">${d.photoCount != null ? d.photoCount + ' 张照片 / ' + (d.videoCount || 0) + ' 个视频' : '—'}</span>
      <span class="k">剩余空间</span><span class="v">${fmtGB(d.freeBytes)}</span>
      <span class="k">定位</span><span class="v">${loc}</span>
      <span class="k">最后在线</span><span class="v">${ago(d.lastSeen)}</span>
      <span class="k">IP</span><span class="v">${esc((d.ip || '').replace('::ffff:', ''))}</span>
    </div>
    <div class="acts">
      <span style="color:var(--dim);font-size:13px;align-self:center">拉取最近</span>
      <input type="number" data-lim value="30" min="1" max="500">
      <span style="color:var(--dim);font-size:13px;align-self:center">张预览</span>
      <button class="primary" data-pull>下发</button>
      <button data-tasks>记录</button>
    </div>
    <div class="tasks" data-list style="display:none"></div>`;
  el.querySelector('[data-pull]').onclick = async () => {
    const limit = parseInt(el.querySelector('[data-lim]').value, 10) || 30;
    try {
      await api('/api/devices/' + encodeURIComponent(d.name) + '/tasks', {
        method: 'POST', headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ type: 'thumbs', params: { limit } }),
      });
      alert(`已下发:拉取最近 ${limit} 张预览。设备在线时约 10 秒内执行,结果出现在 /admin(标记「临时」)。`);
      loadTasks(d.name, el);
    } catch (e) { alert('下发失败:' + e.message); }
  };
  el.querySelector('[data-tasks]').onclick = () => {
    const l = el.querySelector('[data-list]');
    l.style.display = l.style.display === 'none' ? '' : 'none';
    if (l.style.display === '') loadTasks(d.name, el);
  };
  return el;
}

async function loadTasks(name, el) {
  const box = el.querySelector('[data-list]');
  try {
    const r = await api('/api/devices/' + encodeURIComponent(name) + '/tasks');
    box.innerHTML = r.tasks.length
      ? r.tasks.map((t) => `<div>${new Date(t.createdAt).toLocaleTimeString()} · ${t.type} · ${t.status}${t.result ? ' · ' + esc(t.result) : ''}</div>`).join('')
      : '<div style="color:var(--dim)">暂无任务</div>';
  } catch (e) { box.textContent = e.message; }
}

$('btnRefresh').onclick = refresh;
$('btnClearTemp').onclick = async () => {
  if (!confirm('清空所有「临时」预览图?这不会影响已正式上传的素材。')) return;
  try {
    const r = await api('/api/temp', { method: 'DELETE' });
    alert('已清理 ' + r.removed + ' 个临时预览');
    refresh();
  } catch (e) { alert(e.message); }
};
</script>
</body>
</html>
